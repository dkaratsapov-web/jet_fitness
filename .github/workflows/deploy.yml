# Autodeploy Jet Fitness to Yandex Cloud (+ optional Cloudflare relay).
#
# Runs on manual trigger and on push to `main`. Infrastructure is created once
# via infra/yandex/terraform; this pipeline updates the app on every run:
#   1. push the DB schema to Managed PostgreSQL
#   2. package + deploy the Cloud Function (API + bot webhook)
#   3. build the Mini App and sync it to Object Storage
#   4. (optional) deploy the Cloudflare Worker relay
#
# Required secrets: see infra/yandex/SECRETS.md. The Telegram webhook only
# auto-enables once TELEGRAM_API_ROOT (the relay URL) is set; the Cloudflare
# step only runs once CLOUDFLARE_API_TOKEN is set — so the first run can deploy
# with just the Yandex secrets and show the Mini App working.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, claude/telegram-fitness-coach-app-ngmghi]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_API_ROOT: ${{ secrets.TELEGRAM_API_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 1. Database schema ──────────────────────────────────
      # The pooler runs in SESSION mode (see terraform), so the schema engine
      # works directly through port 6432.
      - name: Push DB schema
        run: npm run push --workspace @jet/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── 2. Cloud Function (API + bot webhook) ───────────────
      - name: Package function
        run: bash infra/yandex/package-function.sh

      # Deploy the pre-built zip (with node_modules) via yc CLI directly, so the
      # bundled @prisma/client is uploaded verbatim (yc-actions dropped it via
      # .gitignore filtering).
      - name: Deploy Cloud Function
        env:
          YC_SA_JSON: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_UPLOADS_BUCKET: ${{ secrets.S3_UPLOADS_BUCKET }}
          S3_KEY: ${{ secrets.S3_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
          TELEGRAM_API_ROOT: ${{ secrets.TELEGRAM_API_ROOT }}
          # Health module (Phase 3): stays off unless the secret is set to "true"
          # AND a 32-byte HEALTH_ENCRYPTION_KEY secret is provided.
          HEALTH_MODULE_ENABLED: ${{ secrets.HEALTH_MODULE_ENABLED }}
          HEALTH_ENCRYPTION_KEY: ${{ secrets.HEALTH_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -n -i "$HOME/yc"
          export PATH="$HOME/yc/bin:$PATH"
          printf '%s' "$YC_SA_JSON" > /tmp/sa.json
          yc config profile create ci >/dev/null 2>&1 || yc config profile activate ci
          yc config set service-account-key /tmp/sa.json
          yc config set folder-id "$YC_FOLDER_ID"

          # The package exceeds the 3.5 MB direct-upload limit, so stage it in
          # Object Storage and deploy from there.
          AWS_ACCESS_KEY_ID="$S3_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET" AWS_DEFAULT_REGION=ru-central1 \
            aws s3 cp apps/api/function.zip "s3://$S3_UPLOADS_BUCKET/deploy/function.zip" \
              --endpoint-url https://storage.yandexcloud.net

          EXTRA=()
          if [ -n "${TELEGRAM_API_ROOT:-}" ]; then
            EXTRA+=(--environment "TELEGRAM_API_ROOT=$TELEGRAM_API_ROOT" --environment "ENABLE_TELEGRAM_WEBHOOK=true")
          else
            EXTRA+=(--environment "ENABLE_TELEGRAM_WEBHOOK=false")
          fi

          # Health module: only pass the vars when a key is set (yc rejects empty
          # env values). Absent → module stays disabled via app defaults.
          if [ -n "${HEALTH_ENCRYPTION_KEY:-}" ]; then
            EXTRA+=(--environment "HEALTH_ENCRYPTION_KEY=$HEALTH_ENCRYPTION_KEY")
            EXTRA+=(--environment "HEALTH_MODULE_ENABLED=${HEALTH_MODULE_ENABLED:-false}")
          fi

          yc serverless function version create \
            --function-name jet-fitness-api \
            --runtime nodejs18 \
            --entrypoint handler.handler \
            --memory 512m \
            --execution-timeout 30s \
            --package-bucket-name "$S3_UPLOADS_BUCKET" \
            --package-object-name "deploy/function.zip" \
            --environment "NODE_ENV=production" \
            --environment "BOT_TOKEN=$BOT_TOKEN" \
            --environment "BOT_WEBHOOK_SECRET=$BOT_WEBHOOK_SECRET" \
            --environment "DATABASE_URL=$DATABASE_URL" \
            --environment "INITDATA_TTL_SECONDS=86400" \
            --environment "OWNER_TELEGRAM_IDS=169920903" \
            --environment "MINIAPP_URL=https://storage.yandexcloud.net/jet-fitness-app/index.html" \
            --environment "BOT_USERNAME=coach_pro_bot" \
            --environment "S3_ENDPOINT=https://storage.yandexcloud.net" \
            --environment "S3_BUCKET=$S3_UPLOADS_BUCKET" \
            --environment "S3_KEY=$S3_KEY" \
            --environment "S3_SECRET=$S3_SECRET" \
            "${EXTRA[@]}"

      # Self-check: hit the deployed API from the runner (which can reach Yandex).
      - name: Smoke test API
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
        run: |
          echo "== GET /health =="
          curl -s -m 25 -w "\n-> HTTP %{http_code}\n" "$API_GATEWAY_URL/health" || true
          echo "== GET /api/me (expect 401) =="
          curl -s -m 25 -w "\n-> HTTP %{http_code}\n" "$API_GATEWAY_URL/api/me" || true
          echo "== POST /api/auth/session, empty body (expect 401, not 400) =="
          curl -s -m 25 -X POST -H "content-type: application/json" \
            -w "\n-> HTTP %{http_code}\n" "$API_GATEWAY_URL/api/auth/session" || true

      # ── 3. Mini App static -> Object Storage ────────────────
      - name: Build Mini App
        run: npm run build --workspace @jet/miniapp
        env:
          VITE_API_URL: ${{ secrets.API_GATEWAY_URL }}

      - name: Upload Mini App to Object Storage
        run: |
          aws s3 sync apps/miniapp/dist "s3://${{ secrets.S3_APP_BUCKET }}" \
            --endpoint-url https://storage.yandexcloud.net \
            --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1

      # ── 4. Cloudflare Worker relay (optional) ───────────────
      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare-worker
          command: deploy --var YANDEX_GATEWAY_URL:${{ secrets.API_GATEWAY_URL }}

      # ── 5. Point Telegram's webhook at the relay ────────────
      # Runner can reach api.telegram.org; the relay forwards updates to Yandex.
      - name: Set Telegram webhook
        if: ${{ env.TELEGRAM_API_ROOT != '' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${TELEGRAM_API_ROOT}/webhook" \
            --data-urlencode "secret_token=${BOT_WEBHOOK_SECRET}" \
            --data-urlencode "drop_pending_updates=true" \
            -w "\n-> HTTP %{http_code}\n"
