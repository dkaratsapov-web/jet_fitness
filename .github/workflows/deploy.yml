# Autodeploy Jet Fitness to Yandex Cloud + Cloudflare.
#
# Runs on manual trigger and on push to `main`. Requires the GitHub secrets
# listed in infra/yandex/SECRETS.md. The one-time infrastructure (Managed
# PostgreSQL, Object Storage buckets, API Gateway, service accounts) is created
# once per infra/yandex/DEPLOY.md; this pipeline updates the app on every run.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Cloud Function (API + bot webhook) ──────────────────
      - name: Package function
        run: bash infra/yandex/package-function.sh

      - name: Deploy Cloud Function
        uses: yc-actions/yc-sls-function@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          function-name: jet-fitness-api
          runtime: nodejs18
          memory: 512Mb
          entrypoint: handler.handler
          execution-timeout: 30
          source-root: apps/api/pkg
          include: |
            **/*
          environment: |
            NODE_ENV=production
            ENABLE_TELEGRAM_WEBHOOK=true
            BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            BOT_WEBHOOK_SECRET=${{ secrets.BOT_WEBHOOK_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            TELEGRAM_API_ROOT=${{ secrets.TELEGRAM_API_ROOT }}
            INITDATA_TTL_SECONDS=86400
            HEALTH_MODULE_ENABLED=false
            S3_ENDPOINT=https://storage.yandexcloud.net
            S3_BUCKET=${{ secrets.S3_UPLOADS_BUCKET }}
            S3_KEY=${{ secrets.S3_KEY }}
            S3_SECRET=${{ secrets.S3_SECRET }}

      # ── Mini App static -> Object Storage ───────────────────
      - name: Build Mini App
        run: npm run build --workspace @jet/miniapp
        env:
          VITE_API_URL: ${{ secrets.API_GATEWAY_URL }}

      - name: Upload Mini App to Object Storage
        run: |
          aws s3 sync apps/miniapp/dist "s3://${{ secrets.S3_APP_BUCKET }}" \
            --endpoint-url https://storage.yandexcloud.net \
            --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
          AWS_DEFAULT_REGION: ru-central1

      # ── Cloudflare Worker relay ─────────────────────────────
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/cloudflare-worker
          command: deploy --var YANDEX_GATEWAY_URL:${{ secrets.API_GATEWAY_URL }}
