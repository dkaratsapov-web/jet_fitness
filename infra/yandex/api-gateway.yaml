# Yandex API Gateway spec for Jet Fitness.
# Routes every path/method to the Cloud Function, which runs the Fastify app
# (serves /api/*, /health and /telegram/webhook).
#
# Replace <FUNCTION_ID> and <SERVICE_ACCOUNT_ID> before creating the gateway:
#   yc serverless api-gateway create --name jet-fitness-gw --spec=api-gateway.yaml

openapi: 3.0.0
info:
  title: jet-fitness-api
  version: 1.0.0

x-yc-apigateway:
  cors:
    origin: '*'
    methods: '*'
    allowedHeaders: '*'

paths:
  /:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <FUNCTION_ID>
        service_account_id: <SERVICE_ACCOUNT_ID>
  /{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: proxy
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: <FUNCTION_ID>
        service_account_id: <SERVICE_ACCOUNT_ID>
