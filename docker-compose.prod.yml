# Jet Fitness — PRODUCTION stack (VPS + your domain).
#
# Traefik terminates TLS and obtains Let's Encrypt certificates automatically.
# Routing (two subdomains of your domain):
#   https://${APP_DOMAIN}                      -> miniapp (static, nginx)
#   https://${API_DOMAIN}                      -> api (REST)
#   https://${API_DOMAIN}/telegram/webhook     -> bot (Telegram webhook)
#
# Required in .env:  APP_DOMAIN, API_DOMAIN, ACME_EMAIL, BOT_TOKEN
# (plus DB/redis/minio/payment vars — see .env.example).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# DNS: point both APP_DOMAIN and API_DOMAIN (A/AAAA records) at the VPS IP.

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redirect all HTTP to HTTPS.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jet}
      POSTGRES_DB: jet_fitness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jet -d jet_fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_KEY:-minioadmin} ${S3_SECRET:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-jet-fitness} &&
      echo 'MinIO bucket ready';
      "

  # One-shot: apply Prisma migrations, then exit. api/bot wait for this.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://jet:${POSTGRES_PASSWORD:-jet}@postgres:5432/jet_fitness?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "migrate:deploy", "--workspace", "@jet/db"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://jet:${POSTGRES_PASSWORD:-jet}@postgres:5432/jet_fitness?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      API_HOST: 0.0.0.0
      MINIAPP_URL: https://${APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=le
      - traefik.http.services.api.loadbalancer.server.port=3000

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://jet:${POSTGRES_PASSWORD:-jet}@postgres:5432/jet_fitness?schema=public
      REDIS_URL: redis://redis:6379
      MINIAPP_URL: https://${APP_DOMAIN}
      # Presence of WEBHOOK_URL switches the bot into webhook mode.
      WEBHOOK_URL: https://${API_DOMAIN}/telegram/webhook
      BOT_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      # Higher priority than the api router so the webhook path wins on the same host.
      - traefik.http.routers.bot.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/telegram/webhook`)
      - traefik.http.routers.bot.priority=100
      - traefik.http.routers.bot.entrypoints=websecure
      - traefik.http.routers.bot.tls.certresolver=le
      - traefik.http.services.bot.loadbalancer.server.port=3001

  miniapp:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.miniapp.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.miniapp.entrypoints=websecure
      - traefik.http.routers.miniapp.tls.certresolver=le
      - traefik.http.services.miniapp.loadbalancer.server.port=80

volumes:
  postgres_data:
  redis_data:
  minio_data:
  letsencrypt:
